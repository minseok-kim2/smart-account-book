# 사용법: 이 파일을 application.properties 로 복사하지 말고,
# 아래 환경변수를 실행 환경(OS, IDE Run Configuration, .env 등)에 설정한 뒤 실행하세요.
#
#   DB_USERNAME=root
#   DB_PASSWORD=your_password
#   DB_HOST=localhost   (선택, 기본값 localhost)
#   DB_PORT=3306        (선택, 기본값 3306)
#   DB_NAME=jwbookdb    (선택, 기본값 jwbookdb)
#
# application.properties 는 자격증명을 담고 있어 git 추적에서 제외되어 있습니다.
# 이 파일은 값이 아니라 "어떤 환경변수가 필요한지"를 문서화하는 용도입니다.

spring.application.name=jwbook
server.port=8091
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jwbookdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
